{% extends "base.html" %}
{% block title %}{{ product.name }} - LumiStore{% endblock %}
{% block content %}
<div class="simple-page">
    <a href="{{ url_for('index') }}" class="back-link">← Back to shop</a>
    <div class="detail-card">
        <img src="{{ product.image }}" alt="{{ product.name }}">
        <div class="detail-info">
            <span class="detail-category">{{ product.category }}</span>
            <h1>{{ product.name }}</h1>
            <div class="detail-rating">★ 4.9 · Highly rated</div>
            <p>{{ product.description }}</p>
            <h2>${{ "%.2f"|format(product.price) }}</h2>
            <a class="primary-button" href="{{ url_for('add_to_cart', product_id=product.id) }}">Add to Cart</a>
        </div>
    </div>
</div>
{% endblock %}
